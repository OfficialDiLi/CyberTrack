<body class="bg-gray-900 text-gray-100 font-sans flex h-screen overflow-hidden">

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        // ADDED getDocs and addDoc to the imports
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, orderBy, limit, serverTimestamp, runTransaction, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // Use Debug logging for development
        setLogLevel('Debug');

        // Global Firebase variables
        window.firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        window.initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        window.appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        let app, db, auth;
        window.isAuthReady = false;
        window.userId = null;

        // Firestore paths
        const getPrivateCollectionPath = (collectionName) => `/artifacts/${window.appId}/users/${window.userId}/${collectionName}`;
        const getPublicCollectionPath = (collectionName) => `/artifacts/${window.appId}/public/data/${collectionName}`;

        async function initializeFirebase() {
            try {
                if (Object.keys(window.firebaseConfig).length === 0) {
                    console.error("Firebase config is missing.");
                    return;
                }
                
                app = initializeApp(window.firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                // Authentication
                if (window.initialAuthToken) {
                    await signInWithCustomToken(auth, window.initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        window.userId = user.uid;
                        document.getElementById('user-id-display').textContent = `User ID: ${window.userId}`;
                        window.isAuthReady = true;
                        console.log("Firebase Auth Ready. User ID:", window.userId);
                        // Start data listeners once auth is ready
                        window.setupDataListeners();
                    } else {
                        console.log("Signed out or anonymous.");
                        // Handle sign out state if necessary
                    }
                });

                window.db = db; // Make db available globally for listeners
                window.serverTimestamp = serverTimestamp; // Make serverTimestamp available globally
                window.runTransaction = runTransaction; // Make runTransaction available globally
                window.doc = doc; // Make doc available globally
                window.getDoc = getDoc; // Make getDoc available globally
                window.setDoc = setDoc; // Make setDoc available globally
                // ADDED getDocs and addDoc to the window scope
                window.getDocs = getDocs; // Make getDocs available globally
                window.addDoc = addDoc; // Make addDoc available globally
                window.getPrivateCollectionPath = getPrivateCollectionPath;
                window.getPublicCollectionPath = getPublicCollectionPath;
                window.collection = collection;
                window.query = query;
                window.orderBy = orderBy;
                window.limit = limit;
                window.onSnapshot = onSnapshot;

            } catch (error) {
                console.error("Firebase initialization failed:", error);
            }
        }

        initializeFirebase();
    </script>

    <script>
        let currentPage = 'Dashboard';
        const contentContainer = document.getElementById('content-container');
        const navItems = document.querySelectorAll('.nav-item');

        const badgeClasses = {
            'MALICIOUS': 'bg-red-600',
            'BENIGN': 'bg-green-600',
            'Critical': 'bg-red-600',
            'High': 'bg-yellow-600',
            'Medium': 'bg-blue-600',
            'Low': 'bg-green-600',
            'SUSPICIOUS': 'bg-yellow-600', // Added SUSPICIOUS for simulation logic
        };
        
        // MOVED pageData definition outside of updateContent to be globally accessible
        const pageData = {
            'URL Detector': {
                title: 'URL Detector',
                desc: 'Analyze a URL for potential threats using the trained ML model and VirusTotal integration.',
                input: 'Enter URL',
                button: 'Analyze URL',
                id: 'url'
            },
            'File Scanner': {
                title: 'File Scanner',
                desc: 'Upload a file to calculate its SHA256 hash and check against known threats via VirusTotal.',
                input: 'Select file to scan',
                button: 'Scan File',
                id: 'file'
            },
            'IP Checker': {
                title: 'IP Reputation Checker',
                desc: 'Check the geolocation and ISP information for an IP address using VirusTotal.',
                input: 'Enter IP Address (e.g., 8.8.8.8)',
                button: 'Check IP',
                id: 'ip'
            },
            'Domain Checker': {
                title: 'Domain Reputation Checker',
                desc: 'Check the WHOIS registration data and reputation for a domain name.',
                input: 'Enter Domain Name (e.g., example.com)',
                button: 'Check Domain',
                id: 'domain'
            }
        };


        // --- Data Simulation and Persistence Functions ---

        // Simulate initial data for Threat Feed and Dashboard Stats
        async function setupInitialData() {
            if (!window.db || !window.isAuthReady) return;

            // 1. Dashboard Stats
            const statsRef = window.doc(window.db, window.getPrivateCollectionPath('stats'), 'platform_metrics');
            try {
                const docSnap = await window.getDoc(statsRef);
                if (!docSnap.exists()) {
                    await window.setDoc(statsRef, {
                        threatsDetected: 13,
                        totalScans: 18,
                        filesScanned: 910,
                        updatedAt: window.serverTimestamp()
                    });
                    console.log("Initialized Dashboard Stats.");
                }
            } catch (e) {
                console.error("Error setting up initial stats:", e);
            }

            // 2. Threat Feed (Public Data)
            const threatFeedRef = window.collection(window.db, window.getPublicCollectionPath('threat_feed'));
            const initialThreats = [
                { type: 'Phishing', indicator: 'Generic Credential Theft', severity: 'High', timestamp: new Date('2025-10-12T10:45:00Z') },
                { type: 'Malware', indicator: 'Zeus Trojan Variant', severity: 'Critical', timestamp: new Date('2025-10-12T10:30:00Z') },
                { type: 'C2 Server', indicator: '198.51.100.10', severity: 'Medium', timestamp: new Date('2025-10-12T09:15:00Z') },
                { type: 'Vulnerability', indicator: 'Log4j (CVE-2021-44228)', severity: 'High', timestamp: new Date('2025-10-12T08:00:00Z') },
                { type: 'Defacement', indicator: 'example-gov.com', severity: 'Low', timestamp: new Date('2025-10-12T07:55:00Z') },
            ];

            try {
                const q = window.query(threatFeedRef, window.limit(1));
                const snapshot = await window.getDocs(q); // FIX: Use window.getDocs
                if (snapshot.empty) {
                    for (const threat of initialThreats) {
                        await window.addDoc(threatFeedRef, threat); // FIX: Use window.addDoc
                    }
                    console.log("Initialized Threat Feed.");
                }
            } catch (e) {
                console.error("Error setting up initial threat feed:", e);
            }

            // 3. Scan History (Private Data) - Added for Dashboard/History view
            const historyRef = window.collection(window.db, window.getPrivateCollectionPath('scan_history'));
             const initialHistory = [
                { url: 'https://www.paypal-phish.com', prediction: 'MALICIOUS', confidence: 100, timestamp: new Date('2025-10-13T09:53:49Z') },
                { url: 'https://www.youtube.com', prediction: 'BENIGN', confidence: 100, timestamp: new Date('2025-10-13T09:52:53Z') },
                { url: 'https://your-bank.com', prediction: 'MALICIOUS', confidence: 100, timestamp: new Date('2025-10-13T09:51:52Z') },
                { url: 'https://your-bank.com/login', prediction: 'MALICIOUS', confidence: 100, timestamp: new Date('2025-10-13T09:51:07Z') },
                { url: 'https://www.facebook.com', prediction: 'BENIGN', confidence: 100, timestamp: new Date('2025-10-13T09:50:15Z') },
                { url: 'https://www.bosu.edu.ng', prediction: 'MALICIOUS', confidence: 100, timestamp: new Date('2025-10-13T09:44:55Z') },
                { url: 'https://www.youtube.com', prediction: 'BENIGN', confidence: 100, timestamp: new Date('2025-10-13T09:44:17Z') },
            ];
             try {
                const q = window.query(historyRef, window.limit(1));
                const snapshot = await window.getDocs(q); // FIX: Use window.getDocs
                if (snapshot.empty) {
                    for (const entry of initialHistory) {
                        await window.addDoc(historyRef, entry); // FIX: Use window.addDoc
                    }
                    console.log("Initialized Scan History.");
                }
            } catch (e) {
                console.error("Error setting up initial scan history:", e);
            }
        }

        // Add a new scan entry (simulated for URL detector)
        async function logScanEntry(url, prediction) {
            if (!window.db || !window.isAuthReady) return;
            try {
                const historyRef = window.collection(window.db, window.getPrivateCollectionPath('scan_history'));
                await window.addDoc(historyRef, { // FIX: Use window.addDoc
                    url: url,
                    prediction: prediction,
                    confidence: 100, // Simulated ML confidence
                    timestamp: window.serverTimestamp()
                });
                console.log("Scan entry logged:", url);
                // Also update total scans count
                const statsRef = window.doc(window.db, window.getPrivateCollectionPath('stats'), 'platform_metrics');
                await window.runTransaction(window.db, async (transaction) => {
                    const sfDoc = await transaction.get(statsRef);
                    if (!sfDoc.exists()) {
                        throw "Document does not exist!";
                    }
                    const newTotalScans = sfDoc.data().totalScans + 1;
                    const newThreats = sfDoc.data().threatsDetected + (prediction === 'MALICIOUS' ? 1 : 0);
                    transaction.update(statsRef, { totalScans: newTotalScans, threatsDetected: newThreats });
                });
            } catch (e) {
                console.error("Error logging scan entry:", e);
            }
        }

        // --- View Rendering Logic ---

        function renderDashboard(stats, recentActivity) {
            return `
                <h2 class="text-4xl font-light mb-6">Dashboard</h2>
                <p class="text-gray-400 mb-8">Overview of security metrics and recent activity.</p>
                
                <!-- Metric Cards -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                    <div class="p-6 rounded-xl shadow-lg bg-red-700/80">
                        <h3 class="text-lg font-semibold mb-2">Threats Detected</h3>
                        <p class="text-4xl font-bold">${stats.threatsDetected}</p>
                        <p class="text-sm text-red-200">${stats.threatsDetected} total malicious URLs found.</p>
                    </div>
                    <div class="p-6 rounded-xl shadow-lg bg-gray-700">
                        <h3 class="text-lg font-semibold mb-2">Total Scans</h3>
                        <p class="text-4xl font-bold">${stats.totalScans}</p>
                        <p class="text-sm text-gray-300">Total URLs and IPs scanned.</p>
                    </div>
                    <div class="p-6 rounded-xl shadow-lg bg-blue-700/80">
                        <h3 class="text-lg font-semibold mb-2">Files Scanned</h3>
                        <p class="text-4xl font-bold">${stats.filesScanned}</p>
                        <p class="text-sm text-blue-200">Static number for now.</p>
                    </div>
                </div>

                <!-- Recent Activity Table -->
                <h3 class="text-2xl font-semibold mb-4 border-b border-gray-700 pb-2">Recent Activity</h3>
                ${renderHistoryTable(recentActivity)}
            `;
        }

        function renderHistoryTable(data) {
            const rows = data.map(item => {
                const timestamp = item.timestamp ? (item.timestamp.toDate ? item.timestamp.toDate().toLocaleString('en-US', { hour12: false }) : new Date(item.timestamp).toLocaleString('en-US', { hour12: false })) : 'N/A';
                const predictionClass = badgeClasses[item.prediction] || 'bg-gray-500';
                return `
                    <tr class="hover:bg-gray-700 transition duration-100 border-b border-gray-800">
                        <td class="p-4 text-sm">${timestamp}</td>
                        <td class="p-4 text-sm">${item.url}</td>
                        <td class="p-4 text-sm">
                            <span class="px-3 py-1 rounded-full text-xs font-medium ${predictionClass} text-white">${item.prediction}</span>
                        </td>
                        <td class="p-4 text-sm">${item.confidence ? item.confidence.toFixed(2) + '%' : 'N/A'}</td>
                    </tr>
                `;
            }).join('');

            return `
                <div class="bg-gray-800 rounded-xl shadow-lg overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-700">
                        <thead>
                            <tr>
                                <th class="p-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Timestamp</th>
                                <th class="p-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">URL</th>
                                <th class="p-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Prediction</th>
                                <th class="p-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Confidence</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-800">
                            ${rows}
                        </tbody>
                    </table>
                </div>
                ${data.length === 0 ? '<p class="text-center text-gray-500 mt-4">No scan history found.</p>' : ''}
            `;
        }


        function renderThreatFeed(threats) {
            const rows = threats.map(threat => {
                const timestamp = threat.timestamp ? (threat.timestamp.toDate ? threat.timestamp.toDate().toLocaleString('en-US', { hour12: false }) : new Date(threat.timestamp).toLocaleString('en-US', { hour12: false })) : 'N/A';
                const severityClass = badgeClasses[threat.severity] || 'bg-gray-500';
                return `
                    <tr class="hover:bg-gray-700 transition duration-100 border-b border-gray-800">
                        <td class="p-4 text-sm">${timestamp}</td>
                        <td class="p-4 text-sm">${threat.type}</td>
                        <td class="p-4 text-sm font-mono">${threat.indicator}</td>
                        <td class="p-4 text-sm">
                            <span class="px-3 py-1 rounded-full text-xs font-medium ${severityClass} text-white">${threat.severity}</span>
                        </td>
                    </tr>
                `;
            }).join('');

            return `
                <h2 class="text-4xl font-light mb-6">Threat Intelligence Feed</h2>
                <p class="text-gray-400 mb-8">A simulated feed of recent cybersecurity threats.</p>
                
                <div class="bg-gray-800 rounded-xl shadow-lg overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-700">
                        <thead>
                            <tr>
                                <th class="p-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Timestamp</th>
                                <th class="p-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Type</th>
                                <th class="p-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Name / Indicator</th>
                                <th class="p-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Severity</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-800">
                            ${rows}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderInputView(title, description, inputPlaceholder, buttonText, idPrefix, actionCallback) {
            return `
                <h2 class="text-4xl font-light mb-6">${title}</h2>
                <p class="text-gray-400 mb-8">${description}</p>
                
                <div class="bg-gray-800 p-8 rounded-xl shadow-lg max-w-2xl">
                    <div class="space-y-6">
                        <label for="${idPrefix}-input" class="block text-sm font-medium text-gray-400">${inputPlaceholder}</label>
                        <input type="${idPrefix === 'file' ? 'file' : 'text'}" 
                               id="${idPrefix}-input" 
                               placeholder="${inputPlaceholder}" 
                               class="${idPrefix === 'file' ? 'custom-file-input' : 'w-full p-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-blue-500 focus:border-blue-500'}">
                        
                        <button id="${idPrefix}-button" 
                                class="w-full md:w-auto px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg text-white font-semibold transition duration-150 shadow-md">
                            ${buttonText}
                        </button>

                        <div id="${idPrefix}-result" class="mt-6 p-4 rounded-lg hidden"></div>
                    </div>
                </div>
            `;
        }
        
        // --- Core Application Logic ---

        function updateContent(page) {
            // 1. Update active nav item style
            navItems.forEach(item => {
                if (item.getAttribute('data-page') === page) {
                    item.classList.add('bg-blue-600', 'text-white');
                    item.classList.remove('text-gray-300', 'hover:bg-gray-700');
                } else {
                    item.classList.remove('bg-blue-600', 'text-white');
                    item.classList.add('text-gray-300', 'hover:bg-gray-700');
                }
            });

            // 2. Render view based on page state
            contentContainer.innerHTML = `<p class="text-center text-gray-500">Loading ${page}...</p>`;

            if (pageData[page]) {
                const data = pageData[page];
                contentContainer.innerHTML = renderInputView(
                    data.title, 
                    data.desc, 
                    data.input, 
                    data.button, 
                    data.id, 
                    simulateAnalysis
                );
                
                // Attach event listener for the analysis button
                document.getElementById(`${data.id}-button`).addEventListener('click', () => {
                    const inputElement = document.getElementById(`${data.id}-input`);
                    const inputValue = data.id === 'file' ? inputElement.files[0] : inputElement.value.trim();
                    simulateAnalysis(data.id, inputValue);
                });
            } else if (page === 'Dashboard') {
                // Dashboard is rendered via a live snapshot listener
                if(window.dashboardStats && window.recentHistory) {
                    contentContainer.innerHTML = renderDashboard(window.dashboardStats, window.recentHistory);
                } else {
                     contentContainer.innerHTML = `<p class="text-center text-gray-500">Loading Dashboard metrics...</p>`;
                }
            } else if (page === 'Threat Feed') {
                // Threat Feed is rendered via a live snapshot listener
                if(window.threatFeedData) {
                    contentContainer.innerHTML = renderThreatFeed(window.threatFeedData);
                } else {
                    contentContainer.innerHTML = `<p class="text-center text-gray-500">Loading Threat Feed data...</p>`;
                }
            } else if (page === 'History') {
                // History is rendered via a live snapshot listener
                if(window.fullHistory) {
                    contentContainer.innerHTML = `
                        <h2 class="text-4xl font-light mb-6">Scan History</h2>
                        <p class="text-gray-400 mb-8">A log of all URLs analyzed by the platform.</p>
                        ${renderHistoryTable(window.fullHistory)}
                    `;
                } else {
                    contentContainer.innerHTML = `<p class="text-center text-gray-500">Loading History data...</p>`;
                }
            } else {
                contentContainer.innerHTML = `<h2 class="text-4xl font-light">404 Not Found</h2><p>Page "${page}" not implemented.</p>`;
            }
        }

        // Simulates the API call to the Flask backend/ML model
        async function simulateAnalysis(type, value) {
            const resultDiv = document.getElementById(`${type}-result`);
            const button = document.getElementById(`${type}-button`);

            if (!value) {
                resultDiv.className = 'mt-6 p-4 rounded-lg bg-red-800/50 text-red-300';
                resultDiv.innerHTML = 'Please enter a value or select a file.';
                resultDiv.classList.remove('hidden');
                return;
            }

            button.disabled = true;
            button.textContent = 'Analyzing...';
            resultDiv.classList.add('hidden');

            let verdict = 'BENIGN';
            let summary = '';

            // Simple simulated ML/VT logic
            if (value.includes('phish') || value.includes('malware') || value.includes('bosu.edu.ng')) {
                verdict = 'MALICIOUS';
                summary = 'The analysis determined this entity is **MALICIOUS**. The ML model showed high confidence, and multiple VirusTotal engines flagged it.';
            } else if (value.includes('bank') || value.includes('login') || value.includes('192.168')) {
                verdict = 'SUSPICIOUS';
                summary = 'The analysis flagged this entity as **SUSPICIOUS**. While not overtly malicious, features suggest potential risk (e.g., login form or private IP).';
            } else if (type === 'file') {
                 // For files, we just simulate SHA256 hashing and check
                const filename = value.name || 'uploaded_file.txt';
                if (filename.toLowerCase().endsWith('.exe')) {
                    verdict = 'MALICIOUS';
                    summary = `SHA256 Hash calculated. Verdict: **MALICIOUS**. This file type (.exe) is often associated with high-risk payloads. ${Math.floor(Math.random() * 20) + 5} VirusTotal engines flagged this hash.`;
                } else {
                    verdict = 'BENIGN';
                    summary = `SHA256 Hash calculated. Verdict: **BENIGN**. File has a clean reputation score from VirusTotal.`;
                }
                
            } else {
                verdict = 'BENIGN';
                summary = `The analysis determined this entity is **BENIGN**. All ML features and VirusTotal reports indicate low risk.`;
            }

            // Log the scan if it's a URL
            if (['url', 'ip', 'domain'].includes(type)) {
                await logScanEntry(value, verdict);
            }

            // Display results
            setTimeout(() => {
                button.disabled = false;
                // FIX: pageData is now globally accessible
                button.textContent = pageData[type].button;
                
                const resultClass = verdict === 'MALICIOUS' ? 'bg-red-800/50 text-red-300' : 
                                  verdict === 'SUSPICIOUS' ? 'bg-yellow-800/50 text-yellow-300' : 'bg-green-800/50 text-green-300';
                
                resultDiv.className = `mt-6 p-6 rounded-xl shadow-lg ${resultClass}`;
                resultDiv.innerHTML = `
                    <h4 class="text-xl font-bold mb-2">Analysis Result (${type.toUpperCase()})</h4>
                    <p class="mb-2"><strong>Input:</strong> <span class="font-mono break-all">${type === 'file' ? value.name : value}</span></p>
                    <p class="text-2xl font-extrabold mt-4">VERDICT: 
                        <span class="px-3 py-1 rounded-full text-lg font-bold ${badgeClasses[verdict] || 'bg-gray-500'} text-white">
                            ${verdict}
                        </span>
                    </p>
                    <p class="mt-4">${summary}</p>
                `;
                resultDiv.classList.remove('hidden');
            }, 1500); // Simulate network latency
        }

        // --- Firebase Listeners ---

        window.setupDataListeners = function() {
            if (!window.isAuthReady || !window.db) return;
            
            // Listener for Dashboard & History
            const historyRef = window.collection(window.db, window.getPrivateCollectionPath('scan_history'));
            const qHistory = window.query(historyRef, window.orderBy('timestamp', 'desc'), window.limit(50));
            
            window.onSnapshot(qHistory, (snapshot) => {
                const historyData = snapshot.docs.map(doc => doc.data());
                window.recentHistory = historyData.slice(0, 5); // 5 for dashboard
                window.fullHistory = historyData; // All for history page

                // Only re-render if we are on the page
                if (currentPage === 'History') {
                    contentContainer.innerHTML = `
                        <h2 class="text-4xl font-light mb-6">Scan History</h2>
                        <p class="text-gray-400 mb-8">A log of all URLs analyzed by the platform.</p>
                        ${renderHistoryTable(window.fullHistory)}
                    `;
                }
                if (currentPage === 'Dashboard' && window.dashboardStats) {
                    contentContainer.innerHTML = renderDashboard(window.dashboardStats, window.recentHistory);
                }
            }, (error) => {
                console.error("Error fetching history data:", error);
                if (currentPage === 'History') contentContainer.innerHTML = `<p class="text-red-500">Failed to load history.</p>`;
            });

            // Listener for Dashboard Stats
            const statsRef = window.doc(window.db, window.getPrivateCollectionPath('stats'), 'platform_metrics');
            window.onSnapshot(statsRef, (doc) => {
                if (doc.exists()) {
                    window.dashboardStats = doc.data();
                    if (currentPage === 'Dashboard' && window.recentHistory) {
                        contentContainer.innerHTML = renderDashboard(window.dashboardStats, window.recentHistory);
                    }
                }
            }, (error) => {
                console.error("Error fetching dashboard stats:", error);
                if (currentPage === 'Dashboard') contentContainer.innerHTML = `<p class="text-red-500">Failed to load dashboard metrics.</p>`;
            });

            // Listener for Threat Feed
            const threatFeedRef = window.collection(window.db, window.getPublicCollectionPath('threat_feed'));
            const qThreats = window.query(threatFeedRef, window.orderBy('timestamp', 'desc'), window.limit(10));
            
            window.onSnapshot(qThreats, (snapshot) => {
                window.threatFeedData = snapshot.docs.map(doc => doc.data());
                if (currentPage === 'Threat Feed') {
                    contentContainer.innerHTML = renderThreatFeed(window.threatFeedData);
                }
            }, (error) => {
                console.error("Error fetching threat feed data:", error);
                if (currentPage === 'Threat Feed') contentContainer.innerHTML = `<p class="text-red-500">Failed to load threat feed.</p>`;
            });
            
            setupInitialData(); // Ensure initial data is created if missing
            updateContent(currentPage); // Initial render
        };

        // --- Event Handlers ---

        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                currentPage = item.getAttribute('data-page');
                updateContent(currentPage);
            });
        });

        // Initialize content when script loads (will be updated by the Firebase listener once ready)
        updateContent(currentPage);

    </script>
</body>
</html>
