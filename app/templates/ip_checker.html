{% extends "base.html" %}

{% block title %}IP Checker - Security Platform{% endblock %}

{% block content %}
<h2 class="text-4xl font-light mb-6">IP Reputation Checker</h2>
<p class="text-gray-400 mb-8">Check the reputation of an IP address using AbuseIPDB.</p>

<div class="bg-gray-800 p-8 rounded-xl shadow-lg max-w-4xl">
    <div class="space-y-6">
        <label for="ip-input" class="block text-sm font-medium text-gray-400">Enter IP Address (e.g., 8.8.8.8)</label>
        <input type="text" id="ip-input" placeholder="Enter IP Address (e.g., 8.8.8.8)" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-blue-500 focus:border-blue-500">
        
        <button id="ip-button" class="w-full md:w-auto px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg text-white font-semibold transition duration-150 shadow-md">
            Check IP
        </button>
        
        <div id="ip-result" class="mt-6 p-4 rounded-lg hidden"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('ip-button').addEventListener('click', async function() {
    const inputElement = document.getElementById('ip-input');
    const inputValue = inputElement.value.trim();
    
    const resultDiv = document.getElementById('ip-result');
    const button = document.getElementById('ip-button');
    
    if (!inputValue) {
        resultDiv.className = 'mt-6 p-4 rounded-lg bg-red-800/50 text-red-300';
        resultDiv.innerHTML = 'Please enter an IP address.';
        resultDiv.classList.remove('hidden');
        return;
    }
    
    button.disabled = true;
    button.textContent = 'Checking IP...';
    resultDiv.classList.add('hidden');
    
    try {
        const data = await analyzeInput('ip', inputValue);
        
        button.disabled = false;
        button.textContent = 'Check IP';
        
        if (data) {
            const resultClass = data.verdict === 'MALICIOUS' ? 'bg-red-800/50 text-red-300' :
                              data.verdict === 'SUSPICIOUS' ? 'bg-yellow-800/50 text-yellow-300' : 'bg-green-800/50 text-green-300';
            
            let detailsHtml = '';
            if (data.sources && data.sources.length > 0 && data.sources[0].details) {
                const details = data.sources[0].details;
                detailsHtml = `
                    <h5 class="text-lg font-bold mt-6 mb-4">AbuseIPDB Details</h5>
                    <div class="overflow-x-auto">
                        <table class="min-w-full bg-gray-800 rounded-lg">
                            <tbody>
                                <tr class="border-t border-gray-700">
                                    <td class="px-4 py-2 font-semibold text-gray-400">IP Address</td>
                                    <td class="px-4 py-2">${details.ipAddress}</td>
                                </tr>
                                <tr class="border-t border-gray-700">
                                    <td class="px-4 py-2 font-semibold text-gray-400">Is Public</td>
                                    <td class="px-4 py-2">${details.isPublic}</td>
                                </tr>
                                <tr class="border-t border-gray-700">
                                    <td class="px-4 py-2 font-semibold text-gray-400">IP Version</td>
                                    <td class="px-4 py-2">${details.ipVersion}</td>
                                </tr>
                                <tr class="border-t border-gray-700">
                                    <td class="px-4 py-2 font-semibold text-gray-400">Is Whitelisted</td>
                                    <td class="px-4 py-2">${details.isWhitelisted}</td>
                                </tr>
                                <tr class="border-t border-gray-700">
                                    <td class="px-4 py-2 font-semibold text-gray-400">Abuse Confidence Score</td>
                                    <td class="px-4 py-2">${details.abuseConfidenceScore}%</td>
                                </tr>
                                <tr class="border-t border-gray-700">
                                    <td class="px-4 py-2 font-semibold text-gray-400">Country</td>
                                    <td class="px-4 py-2">${details.countryName} (${details.countryCode})</td>
                                </tr>
                                <tr class="border-t border-gray-700">
                                    <td class="px-4 py-2 font-semibold text-gray-400">Usage Type</td>
                                    <td class="px-4 py-2">${details.usageType}</td>
                                </tr>
                                <tr class="border-t border-gray-700">
                                    <td class="px-4 py-2 font-semibold text-gray-400">ISP</td>
                                    <td class="px-4 py-2">${details.isp}</td>
                                </tr>
                                <tr class="border-t border-gray-700">
                                    <td class="px-4 py-2 font-semibold text-gray-400">Domain</td>
                                    <td class="px-4 py-2">${details.domain}</td>
                                </tr>
                                <tr class="border-t border-gray-700">
                                    <td class="px-4 py-2 font-semibold text-gray-400">Hostnames</td>
                                    <td class="px-4 py-2">${details.hostnames.join(', ')}</td>
                                </tr>
                                <tr class="border-t border-gray-700">
                                    <td class="px-4 py-2 font-semibold text-gray-400">Is Tor</td>
                                    <td class="px-4 py-2">${details.isTor}</td>
                                </tr>
                                <tr class="border-t border-gray-700">
                                    <td class="px-4 py-2 font-semibold text-gray-400">Total Reports</td>
                                    <td class="px-4 py-2">${details.totalReports}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                `;
            }

            resultDiv.className = `mt-6 p-6 rounded-xl shadow-lg ${resultClass}`;
            resultDiv.innerHTML = `
                <h4 class="text-xl font-bold mb-2">Overall Analysis Result</h4>
                <p class="mb-2"><strong>Input:</strong> <span class="font-mono break-all">${data.input_value}</span></p>
                <p class="text-2xl font-extrabold mt-4">VERDICT:
                    <span class="px-3 py-1 rounded-full text-lg font-bold ${badgeClasses[data.verdict] || 'bg-gray-500'} text-white">
                        ${data.verdict}
                    </span>
                </p>
                <p class="mt-4"><strong>Confidence:</strong> ${data.confidence.toFixed(2)}%</p>
                <p class="mt-2"><strong>Summary:</strong> ${data.summary}</p>
                ${detailsHtml}
            `;
            resultDiv.classList.remove('hidden');
        } else {
            resultDiv.className = 'mt-6 p-4 rounded-lg bg-red-800/50 text-red-300';
            resultDiv.innerHTML = 'Error occurred during analysis.';
            resultDiv.classList.remove('hidden');
        }
    } catch (error) {
        console.error('Analysis error:', error);
        
        button.disabled = false;
        button.textContent = 'Check IP';
        
        resultDiv.className = 'mt-6 p-4 rounded-lg bg-red-800/50 text-red-300';
        resultDiv.innerHTML = 'Failed to check IP.';
        resultDiv.classList.remove('hidden');
    }
});
</script>
{% endblock %}
